spring:
  application:
    name: orderflow
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/orderflow}
    username: ${DATABASE_USERNAME:orderflow}
    password: ${DATABASE_PASSWORD:orderflow}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: simple
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
          multiplier: 2.0
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

orderflow:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: orderflow
      ttl: ${JWT_TTL:PT2H}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  bootstrap:
    admin-name: ${ADMIN_NAME:OrderFlow Admin}
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
  cache:
    product-ttl: ${PRODUCT_CACHE_TTL:PT10M}
  idempotency:
    retention: PT24H
    purge-cron: "0 0 * * * *"
  outbox:
    enabled: true
    poll-interval: PT1S
    batch-size: 50
  payment:
    mock-latency: ${PAYMENT_MOCK_LATENCY:PT0.2S}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
